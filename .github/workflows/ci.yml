name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
      - name: Record tested binary checksum
        run: sha256sum target/debug/latticed > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: latticed-linux-x86_64
          path: |
            target/debug/latticed
            SHA256SUMS
          if-no-files-found: error
